# Checks on every push and pull request: the app (typecheck + unit tests) and the pipeline (pytest).
# No data is downloaded or built here. Tests that need built products (app/public/data, data/cache) skip
# themselves; with PIPELINE_OFFLINE=1 a test whose raw inputs (data/raw) are absent is skipped at its first
# network access instead of downloading them (`pytest -rs` lists every skip with its reason).
# The rendered-scene suite (npm run e2e) needs the data and a WebGPU browser: it runs locally (app/e2e/README.md).
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: app (typecheck + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      # The playwright package is only needed by the local scene suite; never fetch browsers in CI.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  pipeline:
    name: pipeline (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    env:
      # No network in tests: a test whose raw inputs are not in data/raw is skipped, never downloads
      # (pipeline/tests/conftest.py).
      PIPELINE_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run pytest -q -rs

  # The user builds on Windows: the same offline suites on windows-latest (Windows paths, locking, text
  # encodings, CRLF checkouts). Informational until it has been green: a failure here does not fail the run.
  windows:
    name: windows (pytest + vitest, informational)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      PIPELINE_OFFLINE: '1'
      PYTHONUTF8: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
          python-version: '3.11'
      - run: uv sync --locked
        working-directory: pipeline
      - run: uv run pytest -q -rs
        working-directory: pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npm test
        working-directory: app
